name: CI-CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/quick-app/values.yaml"
      - "helm/quick-app/Chart.yaml"

permissions:
  contents: write

env:
  DOCKERHUB_USER: meravisingh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag to short commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/frontend:${{ env.TAG }}
            ${{ env.DOCKERHUB_USER }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/backend:${{ env.TAG }}
            ${{ env.DOCKERHUB_USER }}/backend:latest

      - name: Update image tags in helm values.yaml
        run: |
          sed -i '/^frontend:/,/^backend:/ s/^\(\s*tag:\).*/\1 '"$TAG"'/' helm/quick-app/values.yaml
          sed -i '/^backend:/,$ s/^\(\s*tag:\).*/\1 '"$TAG"'/' helm/quick-app/values.yaml
          sed -i 's/^appVersion:.*/appVersion: "'"$TAG"'"/' helm/quick-app/Chart.yaml
          cat helm/quick-app/values.yaml
          grep '^appVersion' helm/quick-app/Chart.yaml

      - name: Commit updated values.yaml and Chart.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/quick-app/values.yaml helm/quick-app/Chart.yaml
          git diff --cached --quiet || git commit -m "ci: update image tags to $TAG [skip ci]"
          git push
